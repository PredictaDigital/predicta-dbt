        description: "Business date (calendar day)."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('sl_dim_date')
                field: date
      - name: page_key
        description: "Key of the normalised page URL. Join to dim_page on project_id and page_key."
        data_tests:
          - not_null
      - name: strategy
        description: "Device profile: mobile or desktop."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('sl_dim_device')
                field: device
      - name: audit_id
        description: "Lighthouse audit identifier. Join to dim_audit."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_audit')
                field: audit_id
      - name: score
        description: "Audit score 0 to 1; -1 when not scored."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: -1
      - name: audit_failed
        description: "1 when the audit scored below 1, otherwise 0. Additive: summing counts failed audits."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: audit_scored
        description: "1 when the audit has a score, otherwise 0. Denominator for a failure rate."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: _loaded_at
        description: "Time the row was loaded into ClickHouse; drives the incremental watermark."
        data_tests:
          - not_null
