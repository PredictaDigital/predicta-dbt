version: 2

models:
  - name: fct_ga4__traffic_daily
    description: "GA4 traffic per project, connection, day, session source and medium. Additive measures only; ratios are computed in the semantic layer."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [project_id, connection_id, date, source, medium]
    columns:
      - name: traffic_daily_key
        description: "Surrogate key of the grain. Unique per row."
        data_tests:
          - not_null
          - unique
      - name: customer_id
        description: "Customer that owns the project. Access scope for row-level security."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string
          - relationships:
              arguments:
                to: ref('dim_project')
                field: customer_id
      - name: project_id
        description: "Project the data belongs to. The isolation boundary: every query is filtered on it."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string
          - relationships:
              arguments:
                to: ref('dim_project')
                field: project_id
      - name: source_app_id
        description: "Source application that produced the row (lineage only, never a tenant key)."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string
          - accepted_values:
              arguments:
                values: ['ga4']
      - name: connection_id
        description: "Source connection that delivered the row (one per account in a source app)."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string
          - relationships:
              arguments:
                to: ref('dim_connection')
                field: connection_id
      - name: source_account_id
        description: "Account inside the source app: GA4 property, Search Console site or Lighthouse website."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string
      - name: date
        description: "Business date (calendar day)."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('sl_dim_date')
                field: date
      - name: source
        description: "GA4 session source."
        data_tests:
          - not_null
      - name: medium
        description: "GA4 session medium."
        data_tests:
          - not_null
      - name: sessions
        description: "Sessions started on the day (GA4 definition)."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: engaged_sessions
        description: "Engaged sessions, derived from the reported bounce rate."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: total_users
        description: "Active users. Not additive across sources or days."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: new_users
        description: "First-time users."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: pageviews
        description: "Page views."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: session_duration_sec
        description: "Total session duration in seconds."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: _loaded_at
        description: "Time the row was loaded into ClickHouse; drives the incremental watermark."
        data_tests:
          - not_null
  - name: fct_ga4__page_daily
    description: "GA4 page views per project, connection, day and normalised page. URL variants are summed onto one page_key."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [project_id, connection_id, date, page_key]
