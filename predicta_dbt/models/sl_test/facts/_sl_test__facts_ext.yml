version: 2

models:
  - name: fct_gsc__search_daily
    description: "Search Console performance per day, normalised page, country, device and search type, from the combined report. Anonymised queries are left out by Search Console, so totals are lower than the page report's."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [project_id, connection_id, date, page_key, search_type, country, device]
    columns:
      - name: search_daily_key
        description: "Surrogate key of the grain. Unique per row."
        data_tests:
          - not_null
          - unique
      - name: customer_id
        description: "Customer that owns the project. Access scope for row-level security."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string
          - relationships:
              arguments:
                to: ref('dim_project')
                field: customer_id
      - name: project_id
        description: "Project the data belongs to. The isolation boundary: every query is filtered on it."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string
          - relationships:
              arguments:
                to: ref('dim_project')
                field: project_id
      - name: source_app_id
        description: "Source application that produced the row (lineage only, never a tenant key)."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string
          - accepted_values:
              arguments:
                values: ['gsc']
      - name: connection_id
        description: "Source connection that delivered the row (one per account in a source app)."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string
          - relationships:
              arguments:
                to: ref('dim_connection')
                field: connection_id
      - name: source_account_id
        description: "Account inside the source app, for example a page, profile or ad account id."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string
      - name: date
        description: "Business date (calendar day)."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('sl_dim_date')
                field: date
      - name: page_key
        description: "Key of the normalised page URL."
        data_tests:
          - not_null
      - name: search_type
        description: "Search Console search type."
        data_tests:
          - not_null
      - name: country
        description: "Country as a lower-case three-letter code."
        data_tests:
          - not_null
      - name: device
        description: "Device: desktop, mobile or tablet."
        data_tests:
          - not_null
      - name: clicks
        description: "Clicks from Google Search."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: impressions
        description: "Times shown in Google Search."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: sum_position
        description: "Position multiplied by impressions; numerator of average position."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: position_impressions
        description: "Impressions that carry a position; denominator of average position."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: _loaded_at
        description: "Time the row was loaded into ClickHouse; drives the incremental watermark."
        data_tests:
          - not_null
