  - name: fct_gsc__url_inspection_daily
    description: "One Search Console URL inspection per page and day: whether Google indexed the page and any problems found."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [project_id, connection_id, date, page_key, verdict, coverage_state, indexing_state, robots_txt_state, page_fetch_state, mobile_usability_verdict, rich_results_verdict]
    columns:
      - name: inspection_daily_key
        description: "Surrogate key of the grain. Unique per row."
        data_tests:
          - not_null
