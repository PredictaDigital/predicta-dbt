      - name: project_id
        description: "Project the data belongs to. The isolation boundary: every query is filtered on it."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string
          - relationships:
              arguments:
                to: ref('dim_project')
                field: project_id
      - name: source_app_id
        description: "Source application that produced the row (lineage only, never a tenant key)."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string
          - accepted_values:
              arguments:
                values: ['gsc']
      - name: connection_id
        description: "Source connection that delivered the row (one per account in a source app)."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string
          - relationships:
              arguments:
                to: ref('dim_connection')
                field: connection_id
      - name: source_account_id
        description: "Account inside the source app, for example a page, profile or ad account id."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string
      - name: date
        description: "Business date (calendar day)."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('sl_dim_date')
                field: date
      - name: page_key
        description: "Key of the inspected page."
        data_tests:
          - not_null
      - name: verdict
        description: "Overall result: PASS, NEUTRAL, FAIL or PARTIAL."
        data_tests:
          - not_null
      - name: coverage_state
        description: "Index coverage state."
        data_tests:
          - not_null
      - name: indexing_state
        description: "Whether indexing is allowed."
        data_tests:
          - not_null
      - name: robots_txt_state
        description: "Whether robots.txt allows crawling."
        data_tests:
          - not_null
      - name: page_fetch_state
        description: "Result of Google's last fetch."
        data_tests:
          - not_null
      - name: mobile_usability_verdict
        description: "Mobile usability result."
        data_tests:
          - not_null
      - name: rich_results_verdict
        description: "Rich results result."
        data_tests:
          - not_null
      - name: inspections
        description: "Number of inspections the row represents (always 1)."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: passed
        description: "1 when the verdict is PASS, otherwise 0. Additive: summing counts passing pages."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: _loaded_at
        description: "Time the row was loaded into ClickHouse; drives the incremental watermark."
        data_tests:
          - not_null
