version: 2

sources:
  - name: sl_raw_pa
    description: >
      Airbyte raw streams for the Predicta Analytics (PA) client, loaded from the
      AWS S3 bucket pa-poc-airbyte-data into ClickHouse database raw_pa_test.
      One row per Airbyte record. The payload is the JSON string in _airbyte_data.
      The same date can arrive in several syncs, so staging keeps only the latest
      sync per natural key.
    schema: raw_pa_test
    tables:
      - name: ga4_pa_traffic_sources
        description: GA4 daily sessions and users by session source and medium.
      - name: ga4_pa_pages
        description: GA4 daily page views by host name and page path.
      - name: gsc_pa_search_analytics_by_date
        description: Search Console daily clicks and impressions for the whole site, per search type.
      - name: gsc_pa_search_analytics_by_page
        description: Search Console daily clicks, impressions and position per page, per search type.
      - name: gsc_pa_search_analytics_by_device
        description: Search Console daily clicks, impressions and position per device, per search type.
      - name: gsc_pa_search_analytics_by_query
        description: Search Console daily clicks, impressions and position per search query, per search type.
      - name: lighthouse_pa_lighthouse_report
        description: One Lighthouse run per URL, device strategy and day, with category scores and core web vitals.
      - name: lighthouse_pa_lighthouse_audit
        description: One row per Lighthouse audit result (check) per run.
      - name: facebook_pa_page
        description: Airbyte raw stream page (Facebook), one row per record.
      - name: facebook_pa_page_insights
        description: Airbyte raw stream page_insights (Facebook), one row per record.
      - name: facebook_pa_post
        description: Airbyte raw stream post (Facebook), one row per record.
      - name: facebook_pa_post_insights
        description: Airbyte raw stream post_insights (Facebook), one row per record.
      - name: facebook_pa_posts
        description: Airbyte raw stream posts (Facebook), one row per record.
      - name: googleads_pa_ad_group_details
        description: Airbyte raw stream ad_group_details (Google Ads), one row per record.
      - name: googleads_pa_ad_performance
        description: Airbyte raw stream ad_performance (Google Ads), one row per record.
      - name: googleads_pa_age_performance
        description: Airbyte raw stream age_performance (Google Ads), one row per record.
      - name: googleads_pa_campaign_details
        description: Airbyte raw stream campaign_details (Google Ads), one row per record.
      - name: googleads_pa_customer
        description: Airbyte raw stream customer (Google Ads), one row per record.
      - name: googleads_pa_device_performance
        description: Airbyte raw stream device_performance (Google Ads), one row per record.
      - name: googleads_pa_gender_performance
        description: Airbyte raw stream gender_performance (Google Ads), one row per record.
      - name: googleads_pa_keyword_performance
        description: Airbyte raw stream keyword_performance (Google Ads), one row per record.
