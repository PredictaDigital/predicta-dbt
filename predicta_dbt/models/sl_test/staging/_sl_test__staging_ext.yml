version: 2

models:
  - name: stg_gsc__search_all_fields
    description: "Grain: project, connection, date, search type, country, device, query and page URL as reported. Latest extract wins. Search Console leaves out anonymised queries from this report, so its totals are lower than the page report's."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [project_id, connection_id, date, search_type, country, device, query, page_url_raw]
    columns:
      - name: customer_id
        description: "Customer that owns the project. Access scope for row-level security."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string
      - name: project_id
        description: "Project the data belongs to. The isolation boundary: every query is filtered on it."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string
      - name: source_app_id
        description: "Source application that produced the row (lineage only, never a tenant key)."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string
          - accepted_values:
              arguments:
                values: ['gsc']
      - name: connection_id
        description: "Source connection that delivered the row (one per account in a source app)."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string
      - name: source_account_id
        description: "Account inside the source app, for example a page, profile or ad account id."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string
      - name: date
        description: "Business date (calendar day)."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: toDate('2020-01-01')
      - name: search_type
        description: "Search Console search type."
        data_tests:
          - not_null
      - name: country
        description: "Country the search came from, as a lower-case three-letter code."
        data_tests:
          - not_null
      - name: device
        description: "Device the search was made on: desktop, mobile or tablet."
        data_tests:
          - not_null
      - name: query
        description: "Search query typed by the user."
        data_tests:
          - not_null
      - name: page_url_raw
        description: "Page URL exactly as Search Console reports it."
        data_tests:
          - not_null
      - name: page_url
        description: "Normalised page URL."
        data_tests:
          - not_null
      - name: clicks
        description: "Clicks from Google Search to the site."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: impressions
        description: "Times the site appeared in Google Search results."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: sum_position
        description: "Average position multiplied by impressions; the additive numerator of average position."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: position_impressions
        description: "Impressions that carry a reported position; the denominator of average position."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: _extracted_at
        description: "Airbyte extract time of the winning row (milliseconds since epoch)."
        data_tests:
          - not_null
      - name: _loaded_at
        description: "Time the row was loaded into ClickHouse."
        data_tests:
          - not_null
