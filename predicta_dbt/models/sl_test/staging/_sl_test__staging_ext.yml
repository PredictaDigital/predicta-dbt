  - name: stg_gsc__url_inspection
    description: "Grain: project, connection, inspection date and page URL. One Search Console URL inspection result per page per day. Latest extract wins."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [project_id, connection_id, date, page_url]
    columns:
      - name: customer_id
        description: "Customer that owns the project. Access scope for row-level security."
        data_tests:
          - not_null
