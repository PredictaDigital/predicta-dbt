      - name: source_app_id
        description: "Source application that produced the row (lineage only, never a tenant key)."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string
          - accepted_values:
              arguments:
                values: ['gsc']
      - name: connection_id
        description: "Source connection that delivered the row (one per account in a source app)."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string
      - name: source_account_id
        description: "Account inside the source app, for example a page, profile or ad account id."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string
      - name: date
        description: "Date the URL was inspected."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: toDate('2020-01-01')
      - name: page_url
        description: "Normalised URL that was inspected."
        data_tests:
          - not_null
      - name: verdict
        description: "Overall result of the inspection: PASS, NEUTRAL, FAIL or PARTIAL."
        data_tests:
          - not_null
      - name: passed
        description: "1 when the verdict is PASS, otherwise 0."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: coverage_state
        description: "Index coverage state, for example 'Submitted and indexed'."
        data_tests:
          - not_null
      - name: indexing_state
        description: "Whether indexing is allowed for the page."
        data_tests:
          - not_null
      - name: robots_txt_state
        description: "Whether robots.txt allows crawling the page."
        data_tests:
          - not_null
      - name: page_fetch_state
        description: "Result of Google's last attempt to fetch the page."
        data_tests:
          - not_null
      - name: mobile_usability_verdict
        description: "Mobile usability result for the page."
        data_tests:
          - not_null
      - name: rich_results_verdict
        description: "Rich results (structured data) result for the page."
        data_tests:
          - not_null
      - name: google_canonical
        description: "Canonical URL Google chose for the page."
        data_tests:
          - not_null
      - name: user_canonical
        description: "Canonical URL declared by the page itself."
        data_tests:
          - not_null
      - name: _extracted_at
        description: "Airbyte extract time of the winning row (milliseconds since epoch)."
        data_tests:
          - not_null
      - name: _loaded_at
        description: "Time the row was loaded into ClickHouse."
