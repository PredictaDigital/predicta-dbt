      - name: date
        description: "Business date (calendar day)."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: toDate('2020-01-01')
      - name: host_name
        description: "Website host the page was served from."
        data_tests:
          - not_null
      - name: path_with_query
        description: "Page path including any query string, exactly as GA4 reports it."
        data_tests:
          - not_null
      - name: page_url
        description: "Normalised page URL: lower case, no query string, fragment or trailing slash."
        data_tests:
          - not_null
