version: 2

models:
  - name: stg_ga4__traffic_sources
    description: "GA4 sessions and users by session source and medium, one row per day, after keeping only the latest Airbyte extract of each key. Engaged sessions are derived from the reported bounce rate."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [project_id, connection_id, date, source, medium]
    columns:
      - name: customer_id
        description: "Customer that owns the project. Access scope for row-level security."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string
      - name: project_id
        description: "Project the data belongs to. The isolation boundary: every query is filtered on it."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string
      - name: source_app_id
        description: "Source application that produced the row (lineage only, never a tenant key)."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string
          - accepted_values:
              arguments:
                values: ['ga4']
      - name: connection_id
        description: "Source connection that delivered the row (one per account in a source app)."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string
      - name: source_account_id
        description: "Account inside the source app: GA4 property, Search Console site or Lighthouse website."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string
      - name: date
        description: "Business date (calendar day)."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: toDate('2020-01-01')
      - name: source
        description: "GA4 session source, for example google or (direct)."
        data_tests:
          - not_null
      - name: medium
        description: "GA4 session medium, for example organic or referral."
        data_tests:
          - not_null
      - name: sessions
        description: "Number of sessions that started on the day."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: engaged_sessions
        description: "Sessions that were engaged, derived as sessions multiplied by one minus the bounce rate."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: total_users
        description: "Distinct users active on the day for this source and medium. Not additive across sources."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: new_users
        description: "Users visiting for the first time on the day."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: pageviews
        description: "Screen or page views recorded in the sessions."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: session_duration_sec
        description: "Total session duration in seconds, derived as average duration multiplied by sessions."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: _extracted_at
        description: "Airbyte extract time of the winning row (milliseconds since epoch)."
        data_tests:
          - not_null
      - name: _loaded_at
        description: "Time the row was loaded into ClickHouse."
        data_tests:
          - not_null
  - name: stg_ga4__pages
    description: "GA4 page views per host and page path per day, after keeping only the latest Airbyte extract of each key. page_url is the normalised address used to build page_key."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [project_id, connection_id, date, host_name, path_with_query]
