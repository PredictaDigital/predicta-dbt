        data_tests:
          - not_null
      - name: raw_url
        description: "The URL variant as it might arrive from a source."
        data_tests:
          - not_null
      - name: normalised_url
        description: "Result of the normalisation macro."
        data_tests:
          - not_null
          - dbt_utils.not_empty_string
