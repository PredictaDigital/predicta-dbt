name: Predicta dbt POC CI/CD

on:
  push:
    branches:
      - poc

  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual build"
        required: false
        default: "Manual build"
        type: string

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  # =========================================================
  # 1. TEST AND LINT
  # =========================================================
  test:
    name: Test and Lint
    runs-on: [self-hosted, predicta-dbt-poc]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Check repository files
        run: |
         echo "Current directory:"
         pwd
         echo "Repository files:"
         ls -la
         find . -maxdepth 3 -type f \
            \( -name "requirements.txt" \
            -o -name "requirements-dev.txt" \
            -o -name "Makefile" \)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r orchestration/requirements.txt

      - name: Install dbt packages
        run: dbt deps --project-dir predicta_dbt

      - name: Validate dbt project
        working-directory: predicta_dbt
        env:
          CH_HOST: ${{ secrets.CH_HOST }}
          CH_PORT: ${{ secrets.CH_PORT }}
          CH_DBT_USER: ${{ secrets.CH_DBT_USER }}
          CH_DBT_PASSWORD: ${{ secrets.CH_DBT_PASSWORD }}
          CH_SECURE: ${{ secrets.CH_SECURE }}
        run: dbt parse

  # =========================================================
  # 2. BUILD AND PUSH DBT IMAGE TO GHCR
  # =========================================================
  build-and-push:
    name: Build and Push dbt Image
    runs-on: [self-hosted, predicta-dbt-poc]
    needs: test
    environment: poc

    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.image.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=poc-latest
            type=sha,prefix=poc-,format=short

      - name: Extract immutable image tag
        id: image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        shell: bash
        run: |
          set -euo pipefail

          IMAGE=$(printf '%s\n' "$TAGS" |
            grep -E ':poc-[a-f0-9]{7}$' |
            head -n 1)

          if [ -z "$IMAGE" ]; then
            echo "ERROR: Could not determine SHA image tag"
            exit 1
          fi

          echo "tag=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "Building image: $IMAGE"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish image details
        env:
          IMAGE: ${{ steps.image.outputs.tag }}
          REASON: ${{ inputs.reason || github.event.head_commit.message || 'Manual build' }}
        shell: bash
        run: |
          {
            echo "## dbt image published"
            echo ""
            echo "- Reason: $REASON"
            echo "- Immutable image: \`$IMAGE\`"
            echo "- POC image: \`ghcr.io/${GITHUB_REPOSITORY}:poc-latest\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo ""
            echo "Prefect will execute dbt using the image configured in its flow/Job."
          } >> "$GITHUB_STEP_SUMMARY"
