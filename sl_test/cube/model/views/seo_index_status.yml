views:
  - name: seo_index_status
    description: "Search Console URL inspection results per page and day: how many inspected pages Google indexed without problems."
    cubes:
      - join_path: gsc_url_inspection_daily
        includes:
          - project_id
          - customer_id
          - date
          - connection_id
          - verdict
          - coverage_state
          - indexing_state
          - robots_txt_state
          - page_fetch_state
          - mobile_usability_verdict
          - rich_results_verdict
          - gsc_inspections
          - gsc_inspections_passed
          - gsc_index_pass_rate
      - join_path: gsc_url_inspection_daily.dim_project
        includes:
          - project_name
          - customer_name
      - join_path: gsc_url_inspection_daily.dim_date
        includes:
          - week_start
          - month_start
          - day_name
          - is_weekend
      - join_path: gsc_url_inspection_daily.dim_page
        includes:
          - page_url
          - host
          - path
