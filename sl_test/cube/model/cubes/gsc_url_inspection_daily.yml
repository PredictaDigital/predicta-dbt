cubes:
  - name: gsc_url_inspection_daily
    sql_table: sl_test.fct_gsc__url_inspection_daily
    public: false
    description: "One Search Console URL inspection per page and day: whether Google indexed the page and any problems found. Source cube: not queried directly, exposed through views."
    joins:
      - name: dim_project
        relationship: many_to_one
        sql: "{CUBE}.project_id = {dim_project}.project_id"
      - name: dim_connection
        relationship: many_to_one
        sql: "{CUBE}.connection_id = {dim_connection}.connection_id"
      - name: dim_date
        relationship: many_to_one
        sql: "{CUBE}.date = {dim_date}.date"
      - name: dim_page
        relationship: many_to_one
        sql: "{CUBE}.project_id = {dim_page}.project_id AND {CUBE}.page_key = {dim_page}.page_key"
    dimensions:
      - name: inspection_daily_key
        sql: inspection_daily_key
        type: string
        description: "Surrogate key of the row (primary key)."
        primary_key: true
        public: false
      - name: project_id
        sql: project_id
        type: string
        description: "Project the data belongs to. Every query is filtered to the projects in the caller's token."
      - name: customer_id
        sql: customer_id
        type: string
        description: "Customer that owns the project. Every query is filtered to the caller's customer."
      - name: connection_id
        sql: connection_id
        type: string
        description: "Source connection that delivered the row."
      - name: date
        sql: date
        type: time
        description: "Business date of the measurement (UTC calendar day)."
      - name: page_key
        sql: toString(page_key)
        type: string
        description: "Key of the inspected page."
        public: false
      - name: verdict
        sql: verdict
        type: string
        description: "Overall result: PASS, NEUTRAL, FAIL or PARTIAL."
      - name: coverage_state
        sql: coverage_state
        type: string
        description: "Index coverage state."
      - name: indexing_state
        sql: indexing_state
        type: string
        description: "Whether indexing is allowed."
      - name: robots_txt_state
        sql: robots_txt_state
        type: string
        description: "Whether robots.txt allows crawling."
      - name: page_fetch_state
        sql: page_fetch_state
        type: string
        description: "Result of Google's last fetch."
      - name: mobile_usability_verdict
        sql: mobile_usability_verdict
        type: string
        description: "Mobile usability result."
      - name: rich_results_verdict
        sql: rich_results_verdict
        type: string
        description: "Rich results result."
    measures:
      - name: gsc_inspections
        type: sum
        sql: inspections
        description: "Number of inspections the row represents (always 1)."
      - name: gsc_inspections_passed
        type: sum
        sql: passed
        description: "1 when the verdict is PASS, otherwise 0. Additive: summing counts passing pages."
      - name: gsc_index_pass_rate
        type: number
        sql: "1.0 * {gsc_inspections_passed} / NULLIF({gsc_inspections}, 0)"
        description: "Share of inspected pages that Google reports as indexed without problems."
        format: percent
    pre_aggregations:
      - name: gsc_url_inspection_daily_daily
        measures:
          - CUBE.gsc_inspections
          - CUBE.gsc_inspections_passed
        dimensions:
          - CUBE.project_id
          - CUBE.customer_id
          - dim_page.page_url
          - CUBE.verdict
          - CUBE.coverage_state
          - CUBE.indexing_state
          - CUBE.robots_txt_state
          - CUBE.page_fetch_state
          - CUBE.mobile_usability_verdict
          - CUBE.rich_results_verdict
        external: true
        time_dimension: CUBE.date
        granularity: day
        partition_granularity: month
        indexes:
          - name: by_project
            columns:
              - CUBE.project_id
              - CUBE.customer_id
        refresh_key:
          every: 1 hour
          incremental: true
          update_window: 7 day
