cubes:
  - name: instagram_user_reach_daily
    sql_table: sl_test.fct_instagram__user_reach_daily
    public: false
    description: "Instagram reach per day, plus trailing 28-day and weekly reach reported on that day (those two are not additive). Source cube: not queried directly, exposed through views."
    joins:
      - name: dim_project
        relationship: many_to_one
        sql: "{CUBE}.project_id = {dim_project}.project_id"
      - name: dim_connection
        relationship: many_to_one
        sql: "{CUBE}.connection_id = {dim_connection}.connection_id"
      - name: dim_date
        relationship: many_to_one
        sql: "{CUBE}.date = {dim_date}.date"
    dimensions:
      - name: user_reach_daily_key
        sql: user_reach_daily_key
        type: string
        description: "Surrogate key of the row (primary key)."
        primary_key: true
        public: false
      - name: project_id
        sql: project_id
        type: string
        description: "Project the data belongs to. Every query is filtered to the projects in the caller's token."
      - name: customer_id
        sql: customer_id
        type: string
        description: "Customer that owns the project. Every query is filtered to the caller's customer."
      - name: connection_id
        sql: connection_id
        type: string
        description: "Source connection that delivered the row."
      - name: date
        sql: date
        type: time
        description: "Business date of the measurement (UTC calendar day)."
    measures:
      - name: ig_reach
        type: sum
        sql: reach
        description: "Accounts reached on the day."
      - name: ig_reach_days_28
        type: sum
        sql: reach_days_28
        description: "Accounts reached over the trailing 28 days."
      - name: ig_reach_week
        type: sum
        sql: reach_week
        description: "Accounts reached over the trailing week."
    pre_aggregations:
      - name: instagram_user_reach_daily_daily
        measures:
          - CUBE.ig_reach
          - CUBE.ig_reach_days_28
          - CUBE.ig_reach_week
        dimensions:
          - CUBE.project_id
          - CUBE.customer_id
        external: true
        time_dimension: CUBE.date
        granularity: day
        partition_granularity: month
        indexes:
          - name: by_project
            columns:
              - CUBE.project_id
              - CUBE.customer_id
        refresh_key:
          every: 1 hour
          incremental: true
          update_window: 7 day
