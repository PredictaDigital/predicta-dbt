cubes:
  - name: dim_connection
    sql_table: sl_test.dim_connection
    public: false
    description: "Source connections: which source app and account feed which project."
    dimensions:
      - name: dim_key
        sql: connection_id
        type: string
        description: "Primary key of the dimension row."
        primary_key: true
        public: false
      - name: connection_id
        sql: connection_id
        type: string
        description: "Connection identifier."
      - name: source_app_id
        sql: source_app_id
        type: string
        description: "Source application: ga4, gsc or lighthouse."
      - name: connection_name
        sql: connection_name
        type: string
        description: "Readable connection name."
