# Creates the Secret that dbt job pods read via envFrom.
# Source of truth is OpenBao; nothing secret is committed.
# apiVersion must match the External Secrets Operator CRD you installed
# (older releases serve external-secrets.io/v1beta1; check `kubectl get crd`).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dbt-clickhouse-credentials
  namespace: predicta-pipeline
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao                    # CHANGE ME to your store name
  target:
    name: dbt-clickhouse-credentials
    creationPolicy: Owner
  data:
    - secretKey: CH_DBT_USER
      remoteRef: {key: predicta/dbt/clickhouse, property: user}
    - secretKey: CH_DBT_PASSWORD
      remoteRef: {key: predicta/dbt/clickhouse, property: password}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dbt-runner
  namespace: predicta-pipeline
